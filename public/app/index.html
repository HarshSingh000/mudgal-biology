<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mudgal Biology — Student App</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <a class="brand" href="#home" onclick="event.preventDefault();app.navigate('home')">
          <img src="/assets/logo.jpg" alt="Mudgal Biology Logo" class="brand-logo" />
          <div class="brand-text">
            <span class="brand-name">Mudgal Biology</span>
            <span class="brand-sub">Aspirant Portal</span>
          </div>
        </a>
        <button id="goalPill" class="goal-pill" style="display:none;" onclick="app.openGoalPicker()" title="Switch Target Exam">
          <span class="goal-dot"></span>
          <span id="goalLabel" class="goal-label">Goal</span>
          <span class="goal-caret">▾</span>
        </button>
      </div>

      <div class="top-actions">
        <button class="action-pill hide-sm" onclick="app.openFlashcardsModal()" title="Daily Flashcards">
          <span>⚡</span><span>Flashcards</span>
        </button>
        <button class="action-pill" onclick="app.toggleLang()" id="langBtn" title="Switch Language">
          <span id="langLabel">EN</span>
        </button>
        <button class="icon-circle" onclick="app.toggleDark()" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">🌓</button>
        <button class="icon-circle notif-btn" onclick="app.openNotifications()" title="Notifications" aria-label="Notifications">
          <span>🔔</span>
          <span id="notifCount" class="notif-badge" style="display:none;">0</span>
        </button>
        <button id="logoutTopBtn" class="action-pill" style="display:none;background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.45);color:#FECACA;" onclick="app.logout()" title="Sign Out">
          <span>🚪</span><span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebarNav">
      <button class="nav-item active" data-tab="home" onclick="app.navigate('home')">🏠 Home</button>
      <button class="nav-item" data-tab="explore" onclick="app.navigate('explore')">🛒 Batches &amp; Store</button>
      <button class="nav-item" data-tab="learning" onclick="app.navigate('learning')">📚 My Library</button>
      <button class="nav-item" data-tab="tests" onclick="app.navigate('tests')">📝 Mock Tests</button>
      <button class="nav-item" data-tab="community" onclick="app.navigate('community')">💬 Doubts &amp; Feed</button>
      <button class="nav-item" data-tab="profile" onclick="app.navigate('profile')">👤 Profile</button>
      <div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;">
        <a href="/" class="nav-item" style="text-decoration:none;">🌐 Public Website</a>
        <a href="/mentorship" class="nav-item" style="text-decoration:none;">💎 GEMS &amp; STF Mentorship</a>
        <a href="/about" class="nav-item" style="text-decoration:none;">ℹ️ About Us</a>
        <a href="/privacy" class="nav-item" style="text-decoration:none;">🔒 Privacy Policy</a>
        <a href="/admin" class="nav-item" style="text-decoration:none;">🛡️ Admin Portal</a>
        <button id="logoutSideBtn" class="nav-item" style="display:none;color:#DC2626;" onclick="app.logout()">🚪 Sign Out</button>
      </div>
    </aside>

    <main class="main" id="mainView">
      <div class="card">Loading Mudgal Biology...</div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="active" data-tab="home" onclick="app.navigate('home')">🏠<span>Home</span></button>
    <button data-tab="explore" onclick="app.navigate('explore')">🛒<span>Batches</span></button>
    <button data-tab="learning" onclick="app.navigate('learning')">📚<span>Library</span></button>
    <button data-tab="tests" onclick="app.navigate('tests')">📝<span>Tests</span></button>
    <button data-tab="profile" onclick="app.navigate('profile')">👤<span>Profile</span></button>
  </nav>

  <div id="modalRoot"></div>
  <script src="/app/app.js"></script>
</body>
</html>
