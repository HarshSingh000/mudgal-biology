<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mudgal Biology — Admin &amp; Faculty Console</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <style>
    :root { --navy:#14213D; --teal:#14B8A6; --teal-dark:#0D9488; --amber:#F4B942; --bg:#F1F5F9; --surface:#FFFFFF; --slate:#64748B; --text:#0F172A; --border:#E2E8F0; --danger:#EF4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    .mobile-header { display:none; background:var(--navy); color:#fff; padding:12px 16px; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:40; }
    .hamburger { background:rgba(255,255,255,.14); border:none; color:#fff; border-radius:8px; padding:7px 11px; font-size:1rem; cursor:pointer; }
    .admin-shell { display:flex; flex:1; min-height:100vh; }
    .side { width:256px; background:var(--navy); color:#fff; padding:20px 14px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; transition:transform .2s ease; }
    .brand { font-weight:800; font-size:1.05rem; padding:6px 8px 16px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px; display:flex; align-items:center; gap:10px; }
    .brand-mark { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg, var(--teal), #2DD4BF); color:var(--navy); display:grid; place-items:center; font-weight:900; font-size:.85rem; }
    .brand-logo { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid var(--teal); background:#fff; flex-shrink:0; }
    .side button, .side a { color:#CBD5E1; text-decoration:none; padding:11px 12px; border-radius:10px; font-weight:600; font-size:.9rem; display:flex; align-items:center; gap:9px; transition:.15s; background:none; border:none; text-align:left; cursor:pointer; width:100%; font-family:inherit; }
    .side button:hover, .side button.active, .side a:hover { background:rgba(20,184,166,.2); color:#5EEAD4; }
    .side-user-box { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:11px 12px; margin-bottom:10px; }
    .side-user-name { color:#FFFFFF; font-weight:700; font-size:.9rem; line-height:1.25; }
    .side-user-role { color:#5EEAD4; font-size:.75rem; font-weight:600; margin-top:2px; }
    .btn-logout, .side button.btn-logout {
      background: linear-gradient(135deg, #EF4444, #DC2626);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: .85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220,38,38,.28);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn-logout:hover, .side button.btn-logout:hover {
      background: linear-gradient(135deg, #DC2626, #B91C1C);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(220,38,38,.38);
    }
    .content { flex:1; padding:24px; max-width:100%; overflow-x:hidden; }
    .page-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .page-head h1 { margin:0; font-size:1.55rem; color:var(--navy); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:18px; box-shadow:0 4px 18px rgba(15,23,42,.04); }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:18px; }
    .kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; border-left:4px solid var(--teal); box-shadow:0 4px 14px rgba(15,23,42,.04); }
    .kpi span { color:var(--slate); font-size:.8rem; font-weight:600; display:block; margin-bottom:4px; }
    .kpi strong { font-size:1.55rem; color:var(--navy); }
    .table-wrap { width:100%; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.88rem; min-width:560px; }
    th, td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--slate); font-size:.76rem; text-transform:uppercase; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; border-radius:9px; border:none; font-weight:600; cursor:pointer; text-decoration:none; font-size:.85rem; }
    .btn-primary { background:var(--teal); color:#042F2E; }
    .btn-navy { background:var(--navy); color:#fff; }
    .btn-amber { background:var(--amber); color:var(--navy); }
    .btn-danger { background:var(--danger); color:#fff; }
    .btn-sm { padding:6px 10px; font-size:.78rem; }
    input, select, textarea { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:9px; margin-bottom:10px; font:inherit; background:#fff; color:var(--text); }
    label { display:block; font-size:.82rem; font-weight:600; color:var(--slate); margin-bottom:4px; }
    .grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; }
    .badge { padding:3px 9px; border-radius:999px; font-size:.74rem; font-weight:700; background:#CCFBF1; color:#0D9488; display:inline-block; }
    .backdrop { display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:45; }
    @media (max-width: 900px) {
      .mobile-header { display:flex; }
      .side { position:fixed; top:0; left:0; bottom:0; z-index:50; transform:translateX(-100%); }
      .side.open { transform:translateX(0); }
      .backdrop.open { display:block; }
      .content { padding:16px; }
    }
  </style>
</head>
<body>
  <div id="adminRoot"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
